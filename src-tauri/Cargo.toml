[package]
name = "kmark"
version = "1.0.0"
description = "A Tauri App"
authors = ["JJ5RZN"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
fs2.workspace = true
kmark-core = { path = "../crates/kmark-core" }
kmark-contract = { path = "../crates/kmark-contract" }
kmark-application = { path = "../crates/kmark-application" }
kmark-rest = { path = "../crates/kmark-rest" }
tauri = { version = "=2.10.3", features = ["protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "=2.5.3"
thiserror = "2"
base64.workspace = true
rand = "0.9"
sha2.workspace = true
tokio.workspace = true
trash = "5.2.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
