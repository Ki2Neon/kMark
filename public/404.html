<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kMark</title>
  </head>
  <body>
    <script>
      (() => {
        const pathSegments = location.pathname.split("/").filter(Boolean);
        const base = pathSegments.length > 0 ? `/${pathSegments[0]}/` : "/";
        const routeSegments = pathSegments.slice(1);
        const route = routeSegments.length > 0 ? `/${routeSegments.join("/")}` : "/";

        location.replace(`${base}${location.search}#${route}${location.hash}`);
      })();
    </script>
  </body>
</html>
