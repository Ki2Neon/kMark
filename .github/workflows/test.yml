name: Test architecture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  functional:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: Frontend lint and architecture checks
        run: pnpm lint
      - name: Prepare desktop sidecar
        run: pnpm build:mcp-sidecar
      - name: Rust formatting and Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets
      - name: Rust workspace tests
        run: pnpm test:rust
      - name: Frontend unit tests
        run: pnpm test:frontend-unit
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Browser integration from fresh WASM
        run: pnpm test:browser
      - name: Real Tauri WebView2 smoke
        run: pnpm test:tauri:smoke
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmark-test-failure
          path: artifacts/
          if-no-files-found: ignore
