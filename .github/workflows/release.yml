name: Release Tauri App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.0.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            args: ""

          - label: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"

          - label: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

          - label: Linux x64
            platform: ubuntu-22.04
            args: ""

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is required."
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vX.Y.Z, for example v1.0.0."
          }
          $commit = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Checked-out release commit is unavailable."
          }
          Write-Host "Release tag: $tag"
          Write-Host "Release commit: $commit"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "kmark ${{ env.RELEASE_TAG }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      - name: List Tauri bundles
        if: success()
        shell: pwsh
        run: |
          $extensions = @(".msi", ".exe", ".dmg", ".AppImage", ".deb", ".rpm")
          $files = Get-ChildItem -Path "src-tauri/target" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $extensions -contains $_.Extension }
          if (-not $files) {
            Write-Error "No Tauri installer or bundle files found under src-tauri/target."
          }
          $files | ForEach-Object { $_.FullName }
