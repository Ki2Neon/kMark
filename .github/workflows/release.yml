name: Release Tauri App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.0.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            args: ""

          - label: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"

          - label: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

          - label: Linux x64
            platform: ubuntu-22.04
            args: ""

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive Tauri version from Git tag
        id: version
        shell: bash
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          TAG="$RAW_TAG"
          VERSION="${TAG#v}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            echo "::error::Use tag format like v0.1.0"
            exit 1
          fi

          COMMIT="$(git rev-parse --verify HEAD)"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          export APP_VERSION="$VERSION"

          node <<'NODE'
          const fs = require("fs");

          const version = process.env.APP_VERSION;

          const config = {
            version
          };

          fs.writeFileSync(
            "src-tauri/tauri.ci.conf.json",
            JSON.stringify(config, null, 2) + "\n"
          );

          console.log(`Generated src-tauri/tauri.ci.conf.json`);
          console.log(`Tauri app version: ${version}`);
          NODE

          echo "Release tag: $TAG"
          echo "Release commit: $COMMIT"

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "kmark ${{ steps.version.outputs.tag }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json

      - name: List Tauri bundles
        if: success()
        shell: pwsh
        run: |
          $extensions = @(".msi", ".exe", ".dmg", ".AppImage", ".deb", ".rpm")
          $files = Get-ChildItem -Path "src-tauri/target" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $extensions -contains $_.Extension }
          if (-not $files) {
            Write-Error "No Tauri installer or bundle files found under src-tauri/target."
          }
          $files | ForEach-Object { $_.FullName }
