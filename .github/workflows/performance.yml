name: Performance measurements

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  browser-benchmark:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:perf
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kmark-performance
          path: artifacts/perf/
          if-no-files-found: warn
  tauri-benchmark:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf:tauri
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kmark-tauri-performance
          path: artifacts/perf/
          if-no-files-found: warn
